# Continous Delivery workflow.
name: Delivery

# Define the event that triggers the workflow.
# Run when release was created, build the docker image and push to ghcr.
on:
  release:
    types: [created]

# Required permission.
permissions:
  contents: read
  packages: write

# Define the jobs that run in the workflow.
jobs:
  # Job-1: Build and Push Docker Image to GHCR.
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout at the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ github.event.release.tag_name }}
