<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fetchly — Your documents</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1><span aria-hidden="true">📁</span> Fetchly</h1>
    <p class="sub">Your personal document vault — welcome back, Alex.</p>
    <ul>
    {% for doc in documents %}
        <li>
            <span><span aria-hidden="true">📄</span> {{ doc }}</span>
            <a class="btn" href="/docs?name={{ doc }}"
               aria-label="Download {{ doc }}">Download</a>
        </li>
    {% endfor %}
    </ul>
    <footer>
        Fetchly — files are served from your private vault via
        <code>/docs?name=&lt;filename&gt;</code>.
    </footer>
</body>
</html>
